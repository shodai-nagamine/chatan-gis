[project]
name = "chatan-gis"
version = "0.1.0"
description = "北谷町の統計をGISで見る（町丁字別の人口・福祉指標＋施設マップ＋議会言及）"
requires-python = ">=3.11"
dependencies = [
    "pyshp>=2.3",
    "requests>=2.31",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts"]
